[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "droidpilot"
version = "0.2.0"
description = "Android device diagnostics, reversible tweaks and startup timing with ADB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
droidpilot = "droidpilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
droidpilot = ["web/*"]
